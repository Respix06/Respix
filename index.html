<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Respix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 500px;
      padding: 32px;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s;
    }
    button:active {
      transform: scale(0.96);
    }
    .interaction-text {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #38bdf8;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bienvenue sur Respix</h1>
    <p>Le site est actuellement en préparation.</p>
    <button onclick="agir()">Découvrir</button>
    <div id="reponse" class="interaction-text">✨ Interaction active !</div>
  </div>

  <script>
    function agir() {
      const el = document.getElementById('reponse');
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }
  </script>
</body>
</html>
